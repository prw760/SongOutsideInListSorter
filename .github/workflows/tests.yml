name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    # Python 3.9 builds are available for 24.04, but not the current ubuntu-latest.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the suite at the default 30-track sample size
        run: python test_playlist.py
      - name: Re-run against a larger songlist
        run: python test_playlist.py --tracks 250
      - name: Re-run against a small songlist
        run: python test_playlist.py --tracks 8
